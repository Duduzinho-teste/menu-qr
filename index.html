<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Menu Digital</title>
<style>
:root{
  --bg:#08090b;
  --bg2:#111216;
  --text:#fff;
  --muted:#a8a8b0;
  --line:rgba(255,255,255,.10);
  --glass:rgba(255,255,255,.075);
  --gold:#e7c98a;
  --gold2:#fff0bd;
  --shadow:0 30px 80px rgba(0,0,0,.48);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow-x:hidden}
.page,.scene,.stores{touch-action:pan-y;}
button{font:inherit}
.page{
  min-height:100svh;
  position:relative;
  overflow:hidden;
  display:flex;
  justify-content:center;
  padding:28px 16px 30px;
  background:
    radial-gradient(circle at 50% 42%, rgba(231,201,138,.12), transparent 26%),
    radial-gradient(circle at 15% 15%, rgba(255,255,255,.05), transparent 22%),
    linear-gradient(180deg,#08090b 0%,#0d0e12 100%);
}
.page:before,.page:after{
  content:"";position:absolute;border-radius:50%;pointer-events:none;filter:blur(2px);
}
.page:before{
  width:280px;height:280px;left:-170px;top:34%;
  background:rgba(231,201,138,.08);
}
.page:after{
  width:300px;height:300px;right:-180px;top:12%;
  background:rgba(255,255,255,.035);
}
.wrap{width:min(760px,100%);position:relative;z-index:2;text-align:center}
.kicker{
  margin-top:4px;
  font-size:10px;font-weight:800;letter-spacing:.34em;text-transform:uppercase;
  color:var(--gold);opacity:.95;
}
h1{
  margin:10px 0 8px;
  font-family:Georgia,"Times New Roman",serif;
  font-weight:500;
  font-size:clamp(34px,8vw,58px);
  line-height:.98;
  letter-spacing:-.03em;
}
.subtitle{
  margin:0 auto;
  max-width:430px;
  color:var(--muted);
  font-size:14px;
  line-height:1.55;
}
.scene{
  width:min(94vw,650px);
  height:min(94vw,650px);
  max-height:650px;
  margin:8px auto 0;
  position:relative;
  display:grid;
  place-items:center;
}
.glow{
  position:absolute;width:40%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(231,201,138,.22),rgba(231,201,138,0) 68%);
  filter:blur(10px);
  animation:pulse 4.5s ease-in-out infinite;
}
.ring{
  position:absolute;width:73%;aspect-ratio:1;border:1px solid rgba(231,201,138,.14);
  border-radius:50%;box-shadow:0 0 70px rgba(231,201,138,.04) inset;
}
.ring.r1{animation:rotate 75s linear infinite}
.ring.r2{width:54%;border-color:rgba(255,255,255,.07);animation:rotateReverse 110s linear infinite}
.dash{
  position:absolute;width:84%;aspect-ratio:1;border-radius:50%;
  border:1px dashed rgba(255,255,255,.09);
  animation:rotate 130s linear infinite;
}
.center{
  width:clamp(112px,25vw,154px);
  aspect-ratio:1;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.045));
  border:1px solid rgba(255,255,255,.14);
  box-shadow:var(--shadow),0 0 70px rgba(231,201,138,.10);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  position:relative;z-index:3;
}
.center small{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:800}
.center strong{margin-top:8px;font-family:Georgia,serif;font-size:clamp(17px,4vw,24px);font-weight:500}
.center:after{
  content:"";position:absolute;inset:8px;border-radius:50%;border:1px solid rgba(255,255,255,.05)
}
.store{
  --size:clamp(108px,24vw,158px);
  position:absolute;width:var(--size);height:var(--size);
  border:1px solid rgba(255,255,255,.14);
  border-radius:50%;padding:8px;
  background:linear-gradient(145deg,rgba(255,255,255,.15),rgba(255,255,255,.045));
  box-shadow:0 22px 55px rgba(0,0,0,.36),0 0 0 7px rgba(255,255,255,.015);
  cursor:pointer;color:white;
  transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .35s;
  -webkit-tap-highlight-color:transparent;
  z-index:4;
  animation:storePulse 3.2s ease-in-out infinite;
}
.store:before{
  content:"";position:absolute;inset:4px;border-radius:50%;
  border:1px solid rgba(255,255,255,.07);pointer-events:none;
}
.store img{
  width:100%;height:100%;display:block;object-fit:contain;border-radius:50%;
  background:#fff;
}

  border-color:rgba(231,201,138,.65);
  box-shadow:0 30px 70px rgba(0,0,0,.52),0 0 35px rgba(231,201,138,.14);
  outline:none;
}
.store:active{transform:scale(.96)}
.label{
  position:absolute;left:50%;bottom:-34px;transform:translateX(-50%);
  white-space:nowrap;padding:6px 10px;border-radius:999px;
  background:rgba(8,9,11,.72);border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(10px);font-size:11px;font-weight:750;color:#eee;
}
.s1{left:8%;top:16%;animation-delay:-.7s}
.s2{right:8%;top:16%;animation-delay:-2s}
.s3{left:10%;bottom:15%;animation-delay:-3.2s}
.s4{right:10%;bottom:15%;animation-delay:-4.1s}
.hint{
  margin-top:-6px;display:inline-flex;align-items:center;gap:8px;
  color:#bcbcc3;font-size:12px;letter-spacing:.02em;
}
.hint:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.footer{margin-top:15px;color:#666770;font-size:10px;letter-spacing:.03em}

.modal{
  position:fixed;inset:0;z-index:50;display:none;
  padding:10px;background:rgba(0,0,0,.78);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.modal.open{display:flex;align-items:center;justify-content:center}
.sheet{
  width:min(100%,980px);height:min(96svh,940px);
  background:#fff;border-radius:22px;overflow:hidden;
  display:flex;flex-direction:column;box-shadow:0 40px 120px rgba(0,0,0,.62);
}
.bar{
  min-height:62px;padding:0 12px 0 18px;
  display:flex;align-items:center;justify-content:space-between;
  color:#171717;background:#fff;border-bottom:1px solid #e9e9e9;
}
.bar strong{font-size:15px}
.actions{display:flex;gap:8px}
.action{
  border:0;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:800;
  cursor:pointer;background:#f1eee9;color:#2b241f;
}
.action.primary{background:#171717;color:#fff}
iframe{border:0;width:100%;height:100%;background:#eee}
@keyframes storePulse{
  0%,100%{
    scale:1;
    filter:brightness(1);
    box-shadow:0 22px 55px rgba(0,0,0,.36),0 0 0 7px rgba(255,255,255,.015);
  }
  50%{
    scale:1.045;
    filter:brightness(1.08);
    box-shadow:0 25px 60px rgba(0,0,0,.40),0 0 28px rgba(231,201,138,.18),0 0 0 9px rgba(231,201,138,.035);
  }
}
@keyframes rotate{to{transform:rotate(360deg)}}
@keyframes rotateReverse{to{transform:rotate(-360deg)}}
@keyframes pulse{0%,100%{transform:scale(.9);opacity:.7}50%{transform:scale(1.08);opacity:1}}
@media(max-width:560px){
  .page{padding-top:24px}
  .scene{height:500px;margin-top:0}
  .s1{left:1%;top:14%}.s2{right:1%;top:14%}
  .s3{left:2%;bottom:13%}.s4{right:2%;bottom:13%}
  .label{font-size:10px;bottom:-31px}
  .ring{width:76%}.dash{width:88%}
}
@media(max-width:390px){
  .scene{height:445px}
  .store{--size:102px}
  .center{width:98px}
  .s1{top:13%}.s2{top:13%}.s3{bottom:13%}.s4{bottom:13%}
  .label{display:none}
}
@media(prefers-reduced-motion:reduce){
  .ring,.ring.r1,.ring.r2,.dash,.store,.glow{animation:none}
  *{scroll-behavior:auto!important}
}

/* V4 — 5 lojas por tela + transição suave */
.scene{
  position:relative;
  height:500px;
  margin-top:4px;
  overflow:visible;
}
.center{display:none !important}

.store{
  --size:clamp(102px,23vw,148px);
  transition:
    left .65s cubic-bezier(.22,.8,.25,1),
    top .65s cubic-bezier(.22,.8,.25,1),
    right .65s cubic-bezier(.22,.8,.25,1),
    bottom .65s cubic-bezier(.22,.8,.25,1),
    opacity .45s ease,
    transform .35s cubic-bezier(.2,.8,.2,1),
    box-shadow .35s;
}
.store.entering{opacity:0;transform:scale(.88)}
.store.visible{opacity:1}
.store.exiting{opacity:0;transform:scale(.88)}

.p1{left:50%;top:4%;transform:translateX(-50%);animation-delay:-.4s}
.p2{right:3%;top:25%;animation-delay:-1.5s}
.p3{right:13%;bottom:6%;animation-delay:-2.6s}
.p4{left:13%;bottom:6%;animation-delay:-3.7s}
.p5{left:3%;top:25%;animation-delay:-4.8s}

.pager{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  margin-top:4px;
}
.navBtn{
  width:34px;height:34px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.045);
  color:#e9e9e9;
  font-size:25px;
  line-height:1;
  cursor:pointer;
  transition:transform .2s,background .2s,border-color .2s;
}
.navBtn:hover,.navBtn:focus-visible{
  background:rgba(255,255,255,.08);
  border-color:rgba(231,201,138,.45);
  transform:scale(1.06);
  outline:none;
}
.navBtn:disabled{opacity:.25;cursor:default;transform:none}
.dots{display:flex;gap:7px;align-items:center}
.dot{
  width:6px;height:6px;border-radius:50%;
  border:0;padding:0;background:rgba(255,255,255,.22);
  transition:transform .25s,background .25s,width .25s;
}
.dot.active{width:18px;border-radius:999px;background:var(--gold)}
.hint{margin-top:10px}

@media(max-width:560px){
  .scene{height:500px}
  .store{--size:101px}
  .p1{top:3%}
  .p2{right:0;top:28%}
  .p3{right:8%;bottom:7%}
  .p4{left:8%;bottom:7%}
  .p5{left:0;top:28%}
  .label{font-size:10px;bottom:-31px}
}
@media(max-width:390px){
  .scene{height:455px}
  .store{--size:94px}
  .p1{top:2%}
  .p2{right:-1%;top:28%}
  .p3{right:7%;bottom:6%}
  .p4{left:7%;bottom:6%}
  .p5{left:-1%;top:28%}
  .label{display:none}
}
@media(prefers-reduced-motion:reduce){
  .store{animation:none!important;transition:none!important}
}


[hidden]{display:none!important}
.sheet{min-height:0}
.bar{flex-shrink:0;gap:8px}
.bar strong{min-width:0}
.menu-images{flex:1;min-height:0;overflow:auto;background:#eee;overscroll-behavior:contain;touch-action:pan-x pan-y pinch-zoom}
.menu-images figure{margin:0 0 12px}
.menu-images img{display:block;width:100%;height:auto;margin:auto;background:white}
.menu-images figcaption{font-size:12px;color:#555;text-align:center;padding:6px}
.menu-images.zoomed figure{width:200%}
.menu-images a{display:block;padding:16px;color:#333}
@media(max-width:560px){.modal{padding:0}.sheet{height:100dvh;max-height:none;border-radius:0}.bar{padding:10px;min-height:60px}.actions{gap:5px}.action{padding:9px 10px}}

/* Keep orbital positioning independent from entrance and tap transforms. */
.store.p1.entering,.store.p1.exiting{transform:translateX(-50%) scale(.88)}
.store.p1:active{transform:translateX(-50%) scale(.96)}
.store:focus-visible{outline:2px solid var(--gold);outline-offset:5px}
.store .label{max-width:150px;white-space:normal;width:max-content}
@media(max-width:560px){.store .label{max-width:110px}}
</style>
</head>
<body>
<main class="page">
<section class="wrap">
  <div class="kicker">Menu Digital</div>
  <h1>Escolha sua loja</h1>
  <p class="subtitle">Encontre sua loja e toque na logo para abrir o cardápio.</p>

  
  <div class="scene" aria-label="Lojas disponíveis">
    <div class="glow"></div>
    <div class="dash"></div>
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div id="stores"></div>
  </div>

  <div class="pager" aria-label="Navegação entre lojas">
    <button id="prevPage" class="navBtn" type="button" aria-label="Lojas anteriores">‹</button>
    <div id="pageDots" class="dots"></div>
    <button id="nextPage" class="navBtn" type="button" aria-label="Próximas lojas">›</button>
  </div>

  <div class="hint">Toque em uma logo</div>
  <div class="footer">Menu digital • acesso rápido pelo QR Code</div>

</section>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Cardápio">
  <div class="sheet">
    <div class="bar">
      <strong id="menuTitle">Cardápio</strong>
      <div class="actions">
        <button class="action primary" id="openPdf">Abrir PDF</button>
        <button class="action" id="zoomMenu" hidden>Ampliar</button>
        <button class="action" onclick="closeMenu()">Voltar</button>
      </div>
    </div>
    <div id="menuImages" class="menu-images" hidden></div>
    <iframe id="menuFrame" src="" title="Cardápio"></iframe>
  </div>
</div>

<script>
/*
  V4 — 5 lojas por tela.
  Para adicionar uma nova loja depois, basta acrescentar:
  {nome:"Nome da loja", logo:"data:image/png;base64,...", cardapio:"arquivo.pdf"}
  O sistema cria automaticamente novas páginas de até 5 lojas.
*/
const lojas = [
  {nome:'Casa Bauducco', historia:'historias/historia-casa-bauducco.webp', logo:'logos/menu-logo-1.png', imagens:['cardapios/casa-bauducco-01.webp', 'cardapios/casa-bauducco-02.webp']},
  {nome:'Casa Café', logo:'logos/menu-logo-2.png', cardapio:'Cardápio Casa Café.pdf', imagens:["cardapios/casa-cafe-01.webp", "cardapios/casa-cafe-02.webp"]},
  {nome:'Rei do Pão de Queijo', logo:'logos/menu-logo-3.png', cardapio:'Cardápio Rei do Pão de Queijo.pdf', imagens:["cardapios/rei-do-pao-de-queijo-01.webp", "cardapios/rei-do-pao-de-queijo-02.webp"]},
  {nome:'Royal Trudel', historia:'historias/historia-royal-trudel.webp', logo:'logos/menu-logo-4.png', cardapio:'cardapio-teste.pdf', imagens:["cardapios/trudel-01.webp", "cardapios/royal-salgados.webp"]},
  {nome:'Capital Coffee', logo:'logos/menu-logo-5.png', cardapio:'cardapio-teste.pdf', imagens:["cardapios/capital-coffee-01.webp", "cardapios/capital-coffee-02.webp"]},
  {nome:'Johnny Rockets', historia:'historias/historia-johnny-rockets.webp', logo:'logos/menu-logo-6.png', imagens:["cardapios/johnny-rockets-01.webp","cardapios/johnny-rockets-02.webp","cardapios/johnny-rockets-03.webp","cardapios/johnny-rockets-04.webp"]},
  {nome:'Lugano', historia:'historias/historia-lugano.webp', logo:'logos/menu-logo-7.png', cardapio:'Cardápio Lugano.pdf', imagens:["cardapios/lugano-01.webp", "cardapios/lugano-02.webp"]},
  {nome:'La Panaderia', logo:'logos/menu-logo-8.png', imagens:['cardapios/la-panaderia-01.webp', 'cardapios/la-panaderia-02.webp']},
  {nome:'Sports Fifteen Bar', historia:'historias/historia-fifteen-sports-bar.webp', logo:'logos/menu-logo-9.png', cardapio:'Sports Bar.pdf', imagens:["cardapios/sports-bar-01.webp", "cardapios/sports-bar-02.webp", "cardapios/sports-bar-03.webp"]},
  {nome:'Salão de Atos PUCRS', logo:'logos/menu-logo-atos.png', imagens:['cardapios/3c-atos-01.webp']}
];

const storesEl = document.getElementById("stores");
const modal = document.getElementById("modal");
const frame = document.getElementById("menuFrame");
const title = document.getElementById("menuTitle");
const openPdf = document.getElementById("openPdf");
const prevPage = document.getElementById("prevPage");
const nextPage = document.getElementById("nextPage");
const pageDots = document.getElementById("pageDots");

const POR_PAGINA = 5;
const totalPaginas = Math.ceil(lojas.length / POR_PAGINA);
let paginaAtual = 0;
let pageChanging = false;
let suppressStoreClickUntil = 0;
const menuImages = document.getElementById("menuImages");
const zoomMenu = document.getElementById("zoomMenu");
let previousFocus = null;
zoomMenu.addEventListener("click", () => {
  const zoomed = menuImages.classList.toggle("zoomed");
  zoomMenu.textContent = zoomed ? "Reduzir" : "Ampliar";
  zoomMenu.setAttribute("aria-pressed", String(zoomed));
});

function renderPager(){
  pageDots.innerHTML = "";
  for(let i=0;i<totalPaginas;i++){
    const dot = document.createElement("span");
    dot.className = "dot" + (i === paginaAtual ? " active" : "");
    pageDots.appendChild(dot);
  }
  prevPage.disabled = paginaAtual === 0;
  nextPage.disabled = paginaAtual === totalPaginas - 1;
}

function renderLojas(direction=1){
  const inicio = paginaAtual * POR_PAGINA;
  const grupo = lojas.slice(inicio, inicio + POR_PAGINA);

  storesEl.innerHTML = "";

  grupo.forEach((loja, i) => {
    const button = document.createElement("button");
    button.className = "store p" + (i + 1) + " entering";
    button.type = "button";
    button.setAttribute("aria-label", "Abrir " + loja.nome);
    button.innerHTML = `<img src="${loja.logo}" alt="${loja.nome}"><span class="label">${loja.nome}</span>`;
    button.style.animationDelay = `${-0.7 - i * 1.05}s`;

    button.addEventListener("click", () => {
      if(performance.now() >= suppressStoreClickUntil) openMenu(loja);
    });
    storesEl.appendChild(button);

    requestAnimationFrame(() => {
      button.classList.remove("entering");
      button.classList.add("visible");
    });
  });

  renderPager();
}

function mudarPagina(delta){
  if(pageChanging) return;
  const nova = paginaAtual + delta;
  if(nova < 0 || nova >= totalPaginas) return;

  pageChanging = true;
  const atual = Array.from(storesEl.children);
  atual.forEach((el, i) => {
    el.classList.remove("visible");
    el.classList.add("exiting");
    el.style.transitionDelay = `${i * 0.025}s`;
  });

  setTimeout(() => {
    paginaAtual = nova;
    renderLojas(delta);
    pageChanging = false;
  }, 260);
}

prevPage.addEventListener("click", () => mudarPagina(-1));
nextPage.addEventListener("click", () => mudarPagina(1));

let swipeStartX = 0;
let swipeStartY = 0;
let swipeStartTime = 0;
let swipeActive = false;

const swipeArea = document.querySelector(".page") || document.body;

swipeArea.addEventListener("pointerdown", e => {
  if (e.target.closest(".modal")) return;

  swipeStartX = e.clientX;
  swipeStartY = e.clientY;
  swipeStartTime = Date.now();
  swipeActive = true;
}, {passive:true});

swipeArea.addEventListener("pointerup", e => {
  if (!swipeActive) return;
  swipeActive = false;

  if (e.target.closest(".modal")) return;

  const diffX = e.clientX - swipeStartX;
  const diffY = e.clientY - swipeStartY;
  const duration = Date.now() - swipeStartTime;

  // Swipe rápido, horizontal e suficientemente longo.
  if (duration > 900) return;
  if (Math.abs(diffX) < 50) return;
  if (Math.abs(diffX) <= Math.abs(diffY)) return;

  suppressStoreClickUntil = performance.now() + 500;
  mudarPagina(diffX < 0 ? 1 : -1);
});

swipeArea.addEventListener("pointercancel", () => {
  swipeActive = false;
});

function openMenu(loja){
  previousFocus = document.activeElement;
  title.textContent = loja.nome;
  frame.src = "";
  menuImages.replaceChildren();
  menuImages.classList.remove("zoomed");
  zoomMenu.textContent = "Ampliar";
  zoomMenu.setAttribute("aria-pressed", "false");
  const pages = [
    ...(loja.historia ? [{src:loja.historia, alt:`História de ${loja.nome}`}] : []),
    ...(loja.imagens || []).map((src, index) => ({src, alt:`Cardápio ${loja.nome} — página ${index + 1}`}))
  ];
  const hasImages = pages.length > 0;
  menuImages.hidden = !hasImages;
  frame.hidden = hasImages;
  zoomMenu.hidden = !hasImages;
  openPdf.hidden = hasImages;
  if(hasImages){
    pages.forEach(({src, alt}, index) => {
      const figure = document.createElement("figure");
      const img = document.createElement("img");
      img.alt = alt;
      img.loading = index === 0 ? "eager" : "lazy";
      img.decoding = "async";
      img.src = src;
      img.addEventListener("error", () => {
        const link = document.createElement("a");
        link.href = src; link.target = "_blank"; link.rel = "noopener";
        link.textContent = "Não foi possível carregar esta página. Toque para tentar abrir.";
        img.replaceWith(link);
      });
      figure.appendChild(img);
      if(pages.length > 1){
        const caption = document.createElement("figcaption");
        caption.textContent = `${loja.historia && index === 0 ? "História • " : ""}Página ${index + 1} de ${pages.length}`;
        figure.appendChild(caption);
      }
      menuImages.appendChild(figure);
    });
  }else{
    frame.src = encodeURI(loja.cardapio);
    openPdf.onclick = () => window.open(encodeURI(loja.cardapio), "_blank", "noopener");
  }
  modal.classList.add("open");
  menuImages.scrollTop = 0; menuImages.scrollLeft = 0;
  document.body.style.overflow = "hidden";
  modal.querySelector('button:not([hidden])').focus();
}

function closeMenu(){
  modal.classList.remove("open");
  frame.src = "";
  menuImages.replaceChildren();
  document.body.style.overflow = "";
  previousFocus?.focus();
}

modal.addEventListener("click", e => {
  if(e.target === modal) closeMenu();
});

document.addEventListener("keydown", e => {
  if(e.key === "Escape") closeMenu();
  if(!modal.classList.contains("open") && e.key === "ArrowRight") mudarPagina(1);
  if(!modal.classList.contains("open") && e.key === "ArrowLeft") mudarPagina(-1);
});

renderLojas();

/* Gentle orbital movement. Existing CSS remains the source of store positions. */
const orbitScene = document.querySelector(".scene");
const orbitMotion = matchMedia("(prefers-reduced-motion: reduce)");
let orbitAngle = 0, orbitLast = 0, orbitFrame = 0;
let orbitItems = [], orbitHover = false, orbitHeld = false, orbitResumeAt = 0;
function measureOrbit(){
  const w = orbitScene.clientWidth, h = orbitScene.clientHeight;
  orbitItems = Array.from(storesEl.children).map(el => {
    const size = el.offsetWidth;
    const x = el.offsetLeft + size / 2 - (el.classList.contains("p1") ? size / 2 : 0);
    const y = el.offsetTop + size / 2;
    // Follow the existing portrait oval, with room for the pulsing logo edges.
    const rx = Math.max(1, (w - size * 1.045) / 2 - 8);
    const ry = Math.max(1, (h - size * 1.045) / 2 - 24);
    const nx = (x - w / 2) / rx, ny = (y - h / 2) / ry;
    const radius = Math.hypot(nx, ny);
    return {el, x, y, rx, ry, phase:Math.atan2(ny,nx), radius:Math.min(1,radius)};
  });
  paintOrbit();
}
function paintOrbit(){
  const w = orbitScene.clientWidth, h = orbitScene.clientHeight;
  orbitItems.forEach(({el,x,y,rx,ry,phase,radius}) => {
    if(orbitMotion.matches){el.style.translate = "";return;}
    const a = phase + orbitAngle;
    el.style.translate = (w/2 + rx*radius*Math.cos(a)-x) + "px " +
      (h/2 + ry*radius*Math.sin(a)-y) + "px";
  });
}
function animateOrbit(now){
  const dt = orbitLast ? Math.min(now-orbitLast,50) : 0;
  orbitLast = now;
  const keyboardFocus = storesEl.querySelector(":focus-visible");
  if(!orbitMotion.matches && !orbitHover && !orbitHeld && !keyboardFocus &&
      !modal.classList.contains("open") && now >= orbitResumeAt){
    orbitAngle = (orbitAngle + dt * Math.PI*2 / 90000) % (Math.PI*2);
    paintOrbit();
  }
  orbitFrame = requestAnimationFrame(animateOrbit);
}
function startOrbit(){
  cancelAnimationFrame(orbitFrame);
  orbitLast = 0;
  if(!document.hidden && !orbitMotion.matches) orbitFrame = requestAnimationFrame(animateOrbit);
  paintOrbit();
}
orbitScene.addEventListener("pointerover", e => {
  if(e.pointerType === "mouse" && e.target.closest(".store")) orbitHover = true;
});
orbitScene.addEventListener("pointerout", e => {
  if(e.pointerType === "mouse" && !e.relatedTarget?.closest?.(".store")) orbitHover = false;
});
swipeArea.addEventListener("pointerdown", () => {orbitHeld = true;}, {passive:true});
function releaseOrbit(){orbitHeld = false;orbitResumeAt = performance.now()+1200;}
window.addEventListener("pointerup", releaseOrbit, {passive:true});
window.addEventListener("pointercancel", releaseOrbit, {passive:true});
window.addEventListener("blur", () => {releaseOrbit();swipeActive=false;});
document.addEventListener("visibilitychange", startOrbit);
orbitMotion.addEventListener("change", () => {measureOrbit();startOrbit();});
new ResizeObserver(measureOrbit).observe(orbitScene);
new MutationObserver(() => {orbitHover=false;measureOrbit();}).observe(storesEl,{childList:true});
measureOrbit();
startOrbit();

</script>
</body>
</html>
